# ci-runner.conf: every site-specific value of host-prep.sh and qualify.sh. Strict KEY=VALUE lines, no quotes,
# no spaces around '=', comments only on their own lines. Parsed, never sourced; unknown keys are refused.
# On the host it lives next to the scripts in SUPPORT_ROOT/setup/, root:wheel 0644, and its SHA-256 is pinned in
# the owner's commands like the scripts' (references/RUNBOOK.md).

# The CI account: a standard user that runs the GitHub runner and every job. UID/GID above 500 and free.
CI_USER=ci-runner
CI_UID=550
CI_GID=550
CI_FULLNAME=CI Runner
# The owner (admin) account that keeps FileVault, sudo and Screen Sharing.
OWNER_USER=admin
OWNER_UID=501
# Optional: refuse to run on another Mac model (sysctl -n hw.model). Empty: any model.
EXPECTED_MODEL=

# The CI volume: encrypted APFS, its own passphrase, capped by a quota and backed by a reserve (bytes). The quota
# must be at least 32 GiB (34359738368): the job-started hook refuses jobs below 15 GiB free on the volume, and an
# iOS build with a simulator needs well over that. The hook also wants 40 GiB free on the Data volume, and
# pf-assert keeps the runner off below 25 GiB there; both floors are fixed in host-prep.sh.
VOL_NAME=CIVolume
VOL_QUOTA_BYTES=107374182400
VOL_RESERVE_BYTES=64424509440
# Free space that must remain in the container after the reserve is taken (bytes).
MIN_CONTAINER_FREE_AFTER_BYTES=68719476736

# Root-owned support tree and the reverse-DNS prefix of every LaunchDaemon, log and pf anchor file.
SUPPORT_ROOT=/opt/macos-ci
LABEL_PREFIX=org.example.macos-ci
# Name of the pf anchors under com.apple/ (letters and digits).
PF_ANCHOR_NAME=MacOSCI

# GitHub: organization, the runner group that lists exactly one repository, the runner name and its extra label.
RUNNER_ORG=example-org
RUNNER_GROUP=macos-ci
RUNNER_NAME=mac-ci-1
RUNNER_EXTRA_LABEL=macos-ci
RUNNER_REPO=example-org/example-ios-app

# Pinned downloads, verified by root before install. Take the SHA-256 from the release pages and check it twice.
RUNNER_VERSION=2.338.2
RUNNER_SHA256=25a065af409ffa317ab4d5a3b614dd15fc9c40f2172bc1b35a1b1258e919a388
TUIST_VERSION=4.218.4
TUIST_SHA256=b34fd5135a7b5b6af04d6667148fcf0fd9bfaf60fea2cb8a15bc8fe84cda9812
# Developer ID team of the Tuist binary (codesign -dv shows TeamIdentifier).
TUIST_TEAM_ID=U6LC622NKF

# SHA-256 of the stock /etc/pf.conf and /etc/pf.anchors/com.apple of your macOS release. Record them on a clean host
# (shasum -a 256 ...); host-prep enables pf only over a stock state.
STOCK_PF_CONF_SHA256=6fb5b260918922ca5ca4dfb296967d8edb9c12f2c043f26b64590758441d682d
STOCK_PF_APPLE_SHA256=0fd7f2c4f02e68615f137ed090cbba2d1facb40da6bf269e1e326ed6a10aa618

# The simulator device the workflow uses (created once in the CI account's session).
SIMULATOR_NAME=CI iPhone

# Admin workstation side: the ssh alias of the CI host (printed instructions, qualify.sh remote) and, for the
# tailnet checks of qualify.sh, the host's tailnet address and one tailnet peer with sshd. Empty: those checks are
# reported as SKIP (not proven), never PASS.
ADMIN_SSH_ALIAS=ci-mac
HOST_TAILNET_IP=
TAILNET_PEER_IP=
